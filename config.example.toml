# Paths may use ~ and are otherwise relative to the configuration file.
# Give each machine its own config.toml. For Windows paths, use literal strings.
[paths]
formal_home = "~/.codex"
test_home = "~/.codex_copy/.codex"
backup_root = "~/.codex-backups"
# Local backup repository. Only the latest uploaded snapshot is checked out.
checkout = "session-backup-checkout"

[repository]
url = "git@github.com:ACCOUNT/PRIVATE-REPOSITORY.git"
branch = "main"
# Keep this many snapshot directories on the branch tip.
keep = 5
# Use the same offset on all machines that share this backup branch.
timestamp_utc_offset_minutes = 0

[desktop]
# Program run by test. The toolkit passes paths.test_home as CODEX_HOME automatically.
# Linux defaults to chatgpt on PATH. macOS looks for Codex.app.
# On Windows, set command to your installed executable.
# command = ['C:\Path\To\Codex.exe']
# Override process detection only if your installation uses different names.
# process_names = ["Codex.exe", "codex-code-mode-host.exe"]
